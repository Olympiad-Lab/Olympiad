
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olympiad Problem Lab</title>

<style>
:root {
  --navy: #142343;
  --blue: #3559ed;
  --light: #f3f6ff;
  --border: #d8e1f5;
  --text: #172544;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--light);
  color: var(--text);
}
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 265px;
  background: var(--navy);
  color: white;
  padding: 24px 16px;
  flex-shrink: 0;
}
.brand {
  font-size: 23px;
  font-weight: bold;
  line-height: 1.25;
  padding: 0 10px 24px;
  border-bottom: 1px solid #455372;
}
.brand small {
  display: block;
  font-size: 12px;
  color: #bdc9e6;
  font-weight: normal;
  margin-top: 7px;
}
.nav-label {
  color: #aebde0;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.3px;
  margin: 25px 10px 10px;
}
.nav {
  width: 100%;
  display: block;
  border: 0;
  background: transparent;
  color: #dbe4ff;
  text-align: left;
  padding: 13px 12px;
  border-radius: 10px;
  font-size: 15px;
  margin: 5px 0;
  cursor: pointer;
}
.nav:hover { background: #25375e; }
.nav.active { background: var(--blue); color: white; }
.nav.topic { padding-left: 22px; }
.nav.question-link {
  border-top: 1px solid #455372;
  border-radius: 0;
  margin-top: 20px;
  padding-top: 22px;
}
.main { flex: 1; min-width: 0; }
.topbar {
  background: white;
  padding: 23px 30px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}
.topbar h1 { margin: 0 0 6px; font-size: 25px; }
.topbar p { margin: 0; color: #657596; font-size: 14px; }
.score {
  background: #e8eeff;
  color: #2444bd;
  padding: 12px 15px;
  border-radius: 12px;
  font-weight: bold;
  white-space: nowrap;
}
.content { padding: 24px; max-width: 1100px; margin: auto; }
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 20px;
}
.question-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.tag {
  display: inline-block;
  background: #e9edff;
  color: #2946bd;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}
select, button { font: inherit; }
select {
  border: 1px solid var(--border);
  background: white;
  padding: 10px;
  border-radius: 9px;
  max-width: 100%;
}
.problem {
  font-size: 21px;
  line-height: 1.65;
  margin: 25px 0;
}
.option {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
}
.option:hover { background: #f5f7ff; }
.option input { accent-color: var(--blue); }
.option.correct { border-color: #159c64; background: #eafaf2; }
.option.wrong { border-color: #df5454; background: #fff0f0; }
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}
.btn {
  border: 1px solid var(--border);
  background: white;
  padding: 12px 16px;
  border-radius: 10px;
  cursor: pointer;
}
.btn.primary { background: var(--blue); color: white; border-color: var(--blue); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.feedback {
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  background: #f1f5ff;
  line-height: 1.6;
  display: none;
}
.feedback.show { display: block; }
.list-item {
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  margin: 10px 0;
  cursor: pointer;
  background: white;
}
.list-item:hover { background: #f2f5ff; }
.muted { color: #687895; font-size: 14px; }
.mobile-menu { display: none; }

@media (max-width: 700px) {
  .app { display: block; }
  .sidebar { width: 100%; padding: 14px; }
  .brand { padding-bottom: 12px; }
  .nav-label { margin-top: 15px; }
  .nav { display: inline-block; width: auto; margin: 3px; }
  .nav.topic { padding-left: 12px; }
  .nav.question-link { border-top: 0; margin-top: 3px; padding-top: 13px; }
  .topbar { padding: 18px; align-items: flex-start; }
  .topbar h1 { font-size: 21px; }
  .score { padding: 10px; font-size: 13px; }
  .content { padding: 12px; }
  .card { padding: 17px; }
  .problem { font-size: 18px; }
}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      🏆 Olympiad Problem Lab
      <small>Think · Solve · Grow</small>
    </div>

    <div class="nav-label">Olympiad</div>
    <button class="nav active" data-view="ioqm">🏆 IOQM</button>

    <div class="nav-label">IOQM Sections</div>
    <button class="nav topic" data-section="NT">π &nbsp; Number Theory (NT)</button>
    <button class="nav topic" data-section="Combinatorics">♧ &nbsp; Combinatorics</button>
    <button class="nav topic" data-section="Algebra">x² &nbsp; Algebra</button>
    <button class="nav topic" data-section="Geometry">△ &nbsp; Geometry</button>

    <button class="nav question-link" data-view="questions">▤ &nbsp; Question Section</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">IOQM Practice</h1>
        <p id="subtitle">Build your problem-solving skills, one question at a time.</p>
      </div>
      <div class="score">⭐ Score: <span id="score">0</span>/<span id="total">5</span></div>
    </header>

    <div class="content" id="content"></div>
  </main>
</div>

<script>
const problems = [
  {
    section: "NT",
    topic: "Remainders and modular arithmetic",
    question: "Find the smallest positive integer n that leaves remainder 2 when divided by 3 and remainder 3 when divided by 5.",
    options: ["5", "8", "13", "18"],
    answer: 1,
    hint: "List numbers that leave remainder 3 when divided by 5. Which also leave remainder 2 when divided by 3?",
    solution: "Numbers that leave remainder 3 when divided by 5 include 3, 8, 13, 18, ... Since 8 divided by 3 leaves remainder 2, the answer is 8."
  },
  {
    section: "Combinatorics",
    topic: "Counting and inclusion-exclusion",
    question: "How many integers from 1 to 30 inclusive are divisible by 2 or 3?",
    options: ["15", "20", "25", "30"],
    answer: 1,
    hint: "Count multiples of 2 and multiples of 3. Subtract numbers counted twice.",
    solution: "There are 15 multiples of 2 and 10 multiples of 3. The 5 multiples of 6 were counted twice, so the total is 15 + 10 − 5 = 20."
  },
  {
    section: "Algebra",
    topic: "Identities and symmetric expressions",
    question: "If x + y = 10 and xy = 21, what is x² + y²?",
    options: ["42", "50", "58", "79"],
    answer: 2,
    hint: "Use (x + y)² = x² + 2xy + y².",
    solution: "x² + y² = (x + y)² − 2xy = 10² − 2(21) = 100 − 42 = 58."
  },
  {
    section: "Geometry",
    topic: "Angles in triangles",
    question: "The angles of a triangle are in the ratio 2 : 3 : 4. What is the largest angle?",
    options: ["40°", "60°", "80°", "100°"],
    answer: 2,
    hint: "The three angles of a triangle add up to 180°.",
    solution: "The ratio has 2 + 3 + 4 = 9 parts. Each part is 180° ÷ 9 = 20°. The largest angle is 4 × 20° = 80°."
  },
  {
    section: "Combinatorics",
    topic: "Arrangements and permutations",
    question: "How many three-digit numbers can be formed from digits 1, 2, 3, 4, 5 without repeating a digit?",
    options: ["15", "25", "60", "125"],
    answer: 2,
    hint: "There are 5 choices for the first digit, then 4, then 3.",
    solution: "By the multiplication principle, there are 5 × 4 × 3 = 60 possible numbers."
  }
];

let selectedSection = "ALL";
let current = 0;
let answers = {};
let checked = {};
let activeView = "ioqm";

const content = document.getElementById("content");
const sectionNames = {
  NT: "Number Theory (NT)",
  Combinatorics: "Combinatorics",
  Algebra: "Algebra",
  Geometry: "Geometry"
};

function visibleProblems() {
  if (selectedSection === "ALL") return problems.map((p, i) => ({p, i}));
  return problems.map((p, i) => ({p, i}))
    .filter(item => item.p.section === selectedSection);
}

function updateScore() {
  const score = problems.reduce((sum, p, i) =>
    sum + (checked[i] && answers[i] === p.answer ? 1 : 0), 0);
  document.getElementById("score").textContent = score;
  document.getElementById("total").textContent = problems.length;
}

function setActiveNav() {
  document.querySelectorAll(".nav").forEach(b => b.classList.remove("active"));
  if (activeView === "questions") {
    document.querySelector('[data-view="questions"]').classList.add("active");
  } else if (selectedSection === "ALL") {
    document.querySelector('[data-view="ioqm"]').classList.add("active");
  } else {
    const btn = document.querySelector(`[data-section="${selectedSection}"]`);
    if (btn) btn.classList.add("active");
  }
}

function render() {
  setActiveNav();
  updateScore();

  const items = visibleProblems();
  if (current >= items.length) current = 0;

  if (activeView === "questions") {
    renderQuestionList();
    return;
  }

  document.getElementById("pageTitle").textContent =
    selectedSection === "ALL" ? "IOQM Practice" : sectionNames[selectedSection];
  document.getElementById("subtitle").textContent =
    "Build your problem-solving skills, one question at a time.";

  if (!items.length) {
    content.innerHTML = "<div class='card'>No questions in this section yet.</div>";
    return;
  }

  const item = items[current];
  const p = item.p;
  const originalIndex = item.i;
  const isChecked = !!checked[originalIndex];

  content.innerHTML = `
    <section class="card">
      <div class="question-head">
        <span class="tag">${sectionNames[p.section]}</span>
        <select id="problemPicker" aria-label="Choose question">
          ${items.map((it, n) =>
            `<option value="${n}" ${n === current ? "selected" : ""}>
              Question ${n + 1} of ${items.length}
            </option>`).join("")}
        </select>
      </div>

      <p class="muted">${p.topic}</p>
      <div class="problem">${p.question}</div>

      <div id="options">
        ${p.options.map((option, i) => {
          let cls = "option";
          if (isChecked && i === p.answer) cls += " correct";
          else if (isChecked && answers[originalIndex] === i) cls += " wrong";
          return `<label class="${cls}">
            <input type="radio" name="answer" value="${i}"
              ${answers[originalIndex] === i ? "checked" : ""}
              ${isChecked ? "disabled" : ""}>
            <strong>${String.fromCharCode(65 + i)}.</strong> ${option}
          </label>`;
        }).join("")}
      </div>

      <div class="actions">
        <button class="btn" id="hintBtn">💡 Show Hint</button>
        <button class="btn" id="solutionBtn">▤ Show Solution</button>
        <button class="btn primary" id="checkBtn" ${isChecked ? "disabled" : ""}>
          ✓ Check Answer
        </button>
      </div>

      <div class="feedback" id="hintBox"></div>
      <div class="feedback" id="solutionBox"></div>
      <div class="feedback" id="resultBox"></div>
    </section>

    <section class="card question-head">
      <button class="btn" id="prevBtn" ${current === 0 ? "disabled" : ""}>← Previous</button>
      <span class="muted">Question ${current + 1} of ${items.length}</span>
      <button class="btn primary" id="nextBtn" ${current === items.length - 1 ? "disabled" : ""}>Next →</button>
    </section>
  `;

  document.getElementById("problemPicker").onchange = e => {
    current = Number(e.target.value);
    render();
  };

  document.querySelectorAll('input[name="answer"]').forEach(input => {
    input.onchange = () => { answers[originalIndex] = Number(input.value); };
  });

  document.getElementById("hintBtn").onclick = () => {
    const box = document.getElementById("hintBox");
    box.textContent = "Hint: " + p.hint;
    box.classList.add("show");
  };

  document.getElementById("solutionBtn").onclick = () => {
    const box = document.getElementById("solutionBox");
    box.textContent = "Solution: " + p.solution;
    box.classList.add("show");
  };

  document.getElementById("checkBtn").onclick = () => {
    if (answers[originalIndex] === undefined) {
      alert("Select an answer first.");
      return;
    }
    checked[originalIndex] = true;
    render();
    const box = document.getElementById("resultBox");
    box.textContent = answers[originalIndex] === p.answer
      ? "Correct! Nice work."
      : "Not quite. Review the solution and try the next question.";
    box.classList.add("show");
  };

  document.getElementById("prevBtn").onclick = () => {
    if (current > 0) { current--; render(); }
  };
  document.getElementById("nextBtn").onclick = () => {
    if (current < items.length - 1) { current++; render(); }
  };

  if (isChecked) {
    const box = document.getElementById("resultBox");
    box.textContent = answers[originalIndex] === p.answer
      ? "Correct! Nice work."
      : "Not quite. Review the solution and try the next question.";
    box.classList.add("show");
  }
}

function renderQuestionList() {
  document.getElementById("pageTitle").textContent = "Question Section";
  document.getElementById("subtitle").textContent =
    "Browse all available IOQM practice questions.";

  content.innerHTML = `
    <section class="card">
      <h2>All Questions</h2>
      <p class="muted">Choose a question to open it in the practice area.</p>
      ${problems.map((p, i) => `
        <div class="list-item" data-question="${i}">
          <strong>${i + 1}. ${sectionNames[p.section]}</strong>
          <p>${p.question}</p>
          <span class="muted">${p.topic} · ${checked[i] ? "Attempted" : "Not attempted"}</span>
        </div>
      `).join("")}
    </section>
  `;

  content.querySelectorAll("[data-question]").forEach(el => {
    el.onclick = () => {
      const targetIndex = Number(el.dataset.question);
      selectedSection = "ALL";
      activeView = "ioqm";
      current = visibleProblems().findIndex(item => item.i === targetIndex);
      render();
    };
  });
}

document.querySelectorAll("[data-section]").forEach(btn => {
  btn.onclick = () => {
    selectedSection = btn.dataset.section;
    activeView = "ioqm";
    current = 0;
    render();
  };
});

document.querySelector('[data-view="ioqm"]').onclick = () => {
  selectedSection = "ALL";
  activeView = "ioqm";
  current = 0;
  render();
};

document.querySelector('[data-view="questions"]').onclick = () => {
  activeView = "questions";
  render();
};

render();
</script>
</body>
</html>
