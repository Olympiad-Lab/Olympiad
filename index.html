    const id = button.dataset.votePoll;
    const poll = OPLX.polls.find(p => String(p.id) === String(id));
    const status = document.querySelector(`[data-poll-status="${CSS.escape(String(id))}"]`);
    const choice = selectedOption(id);
    if (!poll || !choice) { if (status) status.textContent = 'Choose an option before submitting.'; return; }
    if (OPLX.pollVotes[id]) { if (status) status.textContent = 'A vote has already been recorded on this browser.'; return; }
    const idx = Number(choice.value), options = Array.isArray(poll.options) ? poll.options : [];
    if (!Number.isInteger(idx) || idx < 0 || idx >= options.length) { if (status) status.textContent = 'That option is not valid.'; return; }
    button.disabled = true; if (status) status.textContent = 'Submitting vote…';
    try {
      const { error } = await db.from('community_poll_votes').insert({ poll_id: Number(id), voter_token: tokenFor(id), option_index: idx });
      if (error) {
        if (error.code === '23505') throw new Error('A vote has already been recorded on this browser.');
        throw error;
      }
      OPLX.pollVotes[id] = true;
      try { localStorage.setItem('opl_poll_voted_v1', JSON.stringify(OPLX.pollVotes)); } catch (_) {}
      await loadPollResults(id);
      renderPollPage();
      toast('Vote recorded. Thanks for participating.');
    } catch (error) {
      if (status) status.textContent = error?.message || 'The vote could not be submitted. Please try again later.';
      button.disabled = false;
    }
  });

  // Fetch public settings/polls and refresh visible views when they arrive.
  async function loadAboutSettings() {
    if (!db || OPLX.settingsLoading) return;
    OPLX.settingsLoading = true;
    try {
      const { data: row, error } = await db.from('site_settings').select('setting_value').eq('setting_key', 'about_us').maybeSingle();
      if (error) throw error;
      if (row?.setting_value && typeof row.setting_value === 'object') OPLX.about = row.setting_value;
    } catch (error) { console.warn('Editable About Us content unavailable; using fallback.', error?.message || error); }
    finally { OPLX.settingsLoading = false; if (view === 'about') about(); }
  }
  if (view === 'dashboard') render();
  loadAboutSettings();
  loadCommunityPolls();

  // Completion time is displayed in history when available. Fix the library's subsection filtering after select changes.
  document.addEventListener('change', ev => {
    if (ev.target?.id === 'filterExam' || ev.target?.id === 'filterSection') {
      if ($x('filterSubsection')) refreshSubsectionFilter($x('filterSubsection').value || 'ALL');
    }
  });
})();

</script>
</body>
</html>
