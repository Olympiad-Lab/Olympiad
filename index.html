<style>
:root{--navy:#142343;--navy2:#20365d;--blue:#3559ed;--light:#f3f6ff;--border:#d8e1f5;--text:#172544;--muted:#687895;--green:#159c64;--red:#d94b4b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.app{min-height:100vh;display:flex}.sidebar{width:245px;flex-shrink:0;background:var(--navy);color:white;padding:16px 12px;display:flex;flex-direction:column}.brand{font-size:19px;font-weight:bold;padding:8px 8px 18px;border-bottom:1px solid #405172}.brand small{display:block;font-size:12px;font-weight:normal;color:#bdc9e6;margin-top:6px}.nav-label{color:#aebde0;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:20px 9px 7px}.nav,.exam-nav{display:flex;align-items:center;gap:9px;width:100%;border:0;border-radius:9px;padding:11px;color:#dbe4ff;background:transparent;text-align:left;margin:2px 0;font-size:14px}.nav:hover,.exam-nav:hover{background:#25375e}.nav.active,.exam-nav.active{background:var(--blue);color:white}.arrow{margin-left:auto}.exam-list{display:none;padding-left:8px}.exam-list.open{display:block}.exam-nav{font-size:13px;padding:9px}.exam-nav small{display:block;color:#c5d2f1;margin-top:3px}.sidebar-footer{margin-top:auto;color:#aebde0;font-size:11px;padding:18px 8px 4px}.main{flex:1;min-width:0}.topbar{background:white;border-bottom:1px solid var(--border);padding:17px 23px;display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar h1{font-size:22px;margin:0 0 5px}.topbar p{font-size:12px;color:var(--muted);margin:0}.row{display:flex;align-items:center;gap:9px}.score-pill{background:#e8eeff;color:#2444bd;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:bold;white-space:nowrap}.content{max-width:1100px;margin:auto;padding:22px}.card{background:white;border:1px solid var(--border);border-radius:14px;padding:19px;margin-bottom:15px;min-width:0}.hero{background:linear-gradient(135deg,#142343,#3559ed);color:white;border:0;padding:25px}.hero h2{font-size:26px;margin:8px 0}.hero p{color:#dbe4ff;line-height:1.6}.eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:15px}.number{font-size:26px;font-weight:bold;margin:9px 0}.muted{color:var(--muted);font-size:13px;line-height:1.6}.small{font-size:12px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 9px}p{line-height:1.6}.btn{border:1px solid var(--border);background:white;color:var(--text);padding:10px 12px;border-radius:9px;font-size:13px}.btn:hover{border-color:#8299df}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.dark{background:var(--navy);color:white}.btn.danger{color:var(--red)}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tab{padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:white;font-size:13px}.tab.active{background:var(--navy);color:white}.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.section-card{text-align:left;border:1px solid var(--border);border-radius:11px;padding:15px;background:white;color:var(--text)}.section-card:hover{border-color:var(--blue);background:#f8f9ff}.section-card strong{display:block;margin-bottom:6px}.tag{display:inline-block;background:#e9edff;color:#2946bd;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:white;color:var(--text)}.field textarea{min-height:100px;resize:vertical}.problem{font-size:18px;line-height:1.7;margin:20px 0}.option{display:flex;align-items:flex-start;gap:10px;padding:12px;margin:8px 0;border:1px solid var(--border);border-radius:10px;line-height:1.5}.option:hover{background:#f7f8ff}.option input{margin-top:4px;accent-color:var(--blue)}.feedback{padding:12px;border-radius:9px;margin-top:12px;background:#edf2ff;line-height:1.6;white-space:pre-wrap}.good{background:#eafaf2!important}.bad{background:#fff0f0!important}.list-row{padding:12px 0;border-bottom:1px solid var(--border)}.list-row:last-child{border-bottom:0}.bar-row{margin:14px 0}.bar-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px}.bar-bg{height:9px;background:#e8edf8;border-radius:9px;overflow:hidden}.bar-fill{height:100%;background:var(--blue);border-radius:9px}.history-item{border:1px solid var(--border);border-radius:10px;padding:12px;margin:8px 0}.empty{padding:20px;text-align:center;background:#f8faff;border:1px dashed #c5d2eb;border-radius:12px}.timer{font-size:21px;font-weight:bold;color:var(--blue)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 16px;border-radius:10px;z-index:10;display:none;max-width:90%;font-size:13px}.footer-note{font-size:11px;color:var(--muted);margin:14px 0}.menu-toggle{display:none}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.app{display:block}.sidebar{width:100%;padding:10px}.brand{padding:5px 7px 11px}.nav-label{margin:12px 7px 5px}.nav{display:inline-flex;width:auto;padding:9px 10px;font-size:12px}.exam-list{padding-left:0}.exam-nav{display:inline-flex;width:auto;vertical-align:top;padding:8px}.exam-nav small{display:none}.sidebar-footer{display:none}.topbar{padding:13px;align-items:flex-start}.topbar h1{font-size:18px}.menu-toggle{display:inline-block}.content{padding:11px}.card{padding:15px}.hero{padding:19px}.hero h2{font-size:22px}.grid{gap:8px}.stat{padding:11px}.number{font-size:22px}.section-grid{grid-template-columns:1fr}.problem{font-size:16px}}
</style>

<body>
<div class="app">
<aside class="sidebar">
 <div class="brand">🏆 Olympiad Problem Lab<small>Think · Solve · Grow</small></div>
 <div class="nav-label">Main menu</div>
 <button class="nav active" data-view="dashboard">▦ Dashboard</button>
 <button class="nav" data-view="about">ⓘ About Us</button>
 <button class="nav" data-view="questions">▤ All Questions</button>
 <button class="nav" data-view="feedback">✉ Query / Feedback</button>
 <div class="nav-label">Preparation</div>
 <button class="nav" id="olympiadsToggle" aria-expanded="true">🎓 Olympiads <span class="arrow" id="olympiadsArrow">⌄</span></button>
 <div class="exam-list open" id="examList">
  <button class="exam-nav active" data-exam="IOQM">🏆 <span>IOQM<small>Mathematics</small></span></button>
  <button class="exam-nav" data-exam="NSEP">⚛ <span>NSEP<small>Physics</small></span></button>

</aside>
<main class="main">
 <header class="topbar"><div class="row"><button class="btn menu-toggle" id="topMenuBtn">☰</button><div><h1 id="pageTitle">Student Dashboard</h1><p id="subtitle">Your preparation, in one place.</p></div></div><div class="score-pill">Solved: <span id="headerSolved">0</span></div></header>
 <div class="content" id="content"></div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL="https://zuuhhsdnpuncazwtlyqt.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_0l4RpY5d3k5J0TjUOonutA_OH9RjODq";
const db=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const KEY="opl_student_progress_v2";
const EXAMS={
 IOQM:{subject:"Mathematics",description:"Build mathematical reasoning and olympiad problem-solving skills.",sections:["Number Theory (NT)","Combinatorics","Algebra","Geometry"]},
 NSEP:{subject:"Physics",description:"Develop conceptual understanding and quantitative problem-solving.",sections:["Mechanics","Electricity","Optics","Thermodynamics","Waves"]},
 NSEC:{subject:"Chemistry",description:"Practise chemical concepts, calculations, and scientific reasoning.",sections:["Physical Chemistry","Organic Chemistry","Inorganic Chemistry"]},
 NSEB:{subject:"Biology",description:"Strengthen biological concepts and scientific reasoning.",sections:["Cell Biology","Genetics","Ecology","Physiology","Evolution"]}
};
const starter=[
{id:"i1",olympiad:"IOQM",section:"Number Theory (NT)",topic:"Remainders",question:"Find the smallest positive integer n that leaves remainder 2 when divided by 3 and remainder 3 when divided by 5.",options:["5","8","13","18"],answer:1,hint:"Try numbers that leave remainder 3 when divided by 5.",solution:"8 leaves remainder 2 when divided by 3 and remainder 3 when divided by 5."},
{id:"i2",olympiad:"IOQM",section:"Combinatorics",topic:"Counting",question:"How many integers from 1 to 30 inclusive are divisible by 2 or 3?",options:["15","20","25","30"],answer:1,hint:"Count multiples of 2 and 3, then subtract multiples of 6.",solution:"15 + 10 − 5 = 20."},
{id:"i3",olympiad:"IOQM",section:"Algebra",topic:"Identities",question:"If x + y = 10 and xy = 21, what is x² + y²?",options:["42","50","58","79"],answer:2,hint:"Use (x + y)² = x² + 2xy + y².",solution:"x² + y² = 100 − 42 = 58."},
{id:"i4",olympiad:"IOQM",section:"Geometry",topic:"Triangle angles",question:"The angles of a triangle are in the ratio 2 : 3 : 4. What is the largest angle?",options:["40°","60°","80°","100°"],answer:2,hint:"Triangle angles sum to 180°.",solution:"There are 9 parts; each is 20°. Largest = 4 × 20° = 80°."},
{id:"i5",olympiad:"IOQM",section:"Combinatorics",topic:"Permutations",question:"How many three-digit numbers can be formed from digits 1, 2, 3, 4, 5 without repetition?",options:["15","25","60","125"],answer:2,hint:"There are 5 choices, then 4, then 3.",solution:"5 × 4 × 3 = 60."},
{id:"p1",olympiad:"NSEP",section:"Mechanics",topic:"Speed",question:"A cyclist travels 100 metres in 20 seconds at constant speed. What is the speed?",options:["2 m/s","4 m/s","5 m/s","10 m/s"],answer:2,hint:"Speed = distance ÷ time.",solution:"100 ÷ 20 = 5 m/s."},
{id:"p2",olympiad:"NSEP",section:"Mechanics",topic:"Acceleration",question:"An object starts from rest and accelerates at 2 m/s². What is its speed after 3 seconds?",options:["2 m/s","3 m/s","5 m/s","6 m/s"],answer:3,hint:"Use v = u + at.",solution:"v = 0 + 2 × 3 = 6 m/s."},
{id:"c1",olympiad:"NSEC",section:"Inorganic Chemistry",topic:"Atomic structure",question:"How many electrons are in a neutral oxygen atom with atomic number 8?",options:["6","8","10","16"],answer:1,hint:"In a neutral atom, electrons equal protons.",solution:"A neutral oxygen atom has 8 electrons."},
{id:"c2",olympiad:"NSEC",section:"Physical Chemistry",topic:"Moles",question:"Approximately how many moles are in 18 g of water (H₂O)?",options:["0.5 mol","1 mol","2 mol","18 mol"],answer:1,hint:"Molar mass of water is about 18 g/mol.",solution:"18 ÷ 18 = 1 mol."},
{id:"b1",olympiad:"NSEB",section:"Cell Biology",topic:"Cell organelles",question:"Which organelle is most directly associated with aerobic ATP production?",options:["Ribosome","Mitochondrion","Golgi apparatus","Lysosome"],answer:1,hint:"Think of cellular respiration.",solution:"Mitochondria are the main site of aerobic cellular respiration."},
{id:"b2",olympiad:"NSEB",section:"Genetics",topic:"Basic genetics",question:"How many copies of each autosomal gene does a typical diploid human cell carry?",options:["One","Two","Three","Four"],answer:1,hint:"One copy is usually inherited from each parent.",solution:"A typical diploid cell has two copies of each autosomal gene."}
];
function fresh(){return {attempts:{},history:[],feedback:[],bookmarks:[]}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||"null");return x&&typeof x==="object"?{...fresh(),...x}:fresh()}catch(e){return fresh()}}
let data=load(),questions=[...starter],exam="IOQM",view="dashboard",expanded=true,mode="simple",section="ALL",idx=0,selected={},revealed={},test=null,timer=null;
const $=id=>document.getElementById(id),root=$("content");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));header()}catch(e){toast("Browser storage unavailable. Progress may not save.")}}
function header(){$("headerSolved").textContent=Object.values(data.attempts).filter(a=>a.checked).length}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").style.display="none",2400)}
function qs(e=exam){return questions.filter(q=>q.olympiad===e)}
function secList(e=exam){return [...new Set([...(EXAMS[e].sections),...qs(e).map(q=>q.section)])]}
function done(e=exam){return qs(e).filter(q=>data.attempts[q.id]?.checked)}
function history(e=exam){return data.history.filter(h=>h.exam===e)}
function accuracy(e=exam){let a=done(e);return a.length?Math.round(a.filter(q=>data.attempts[q.id].correct).length/a.length*100):0}
function page(title,sub){$("pageTitle").textContent=title;$("subtitle").textContent=sub}
function nav(){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));document.querySelectorAll("[data-exam]").forEach(b=>b.classList.toggle("active",b.dataset.exam===exam&&view==="exam"));$("examList").classList.toggle("open",expanded);$("olympiadsToggle").setAttribute("aria-expanded",String(expanded));$("olympiadsArrow").textContent=expanded?"⌄":"›";header()}
function go(v){stopTimer();view=v;nav();render()}
function pickExam(e){stopTimer();exam=e;view="exam";section="ALL";mode="simple";idx=0;nav();render()}
function stat(label,num,sub){return `<div class="card stat"><div class="muted">${esc(label)}</div><div class="number">${esc(num)}</div><div class="muted small">${esc(sub||"")}</div></div>`}
function btn(label,action,primary=false){return `<button class="btn ${primary?"primary":""}" data-action="${esc(action)}">${esc(label)}</button>`}
function dashboard(){page("Student Dashboard","Your preparation, in one place.");let total=Object.values(data.attempts).filter(a=>a.checked).length,correct=Object.values(data.attempts).filter(a=>a.checked&&a.correct).length;let hs=history(exam).slice(-6);let bars=hs.length?hs.map(h=>`<div class="bar-row"><div class="bar-head"><span>${esc(h.mode)} · ${esc(h.date)}</span><strong>${h.score}/${h.total}</strong></div><div class="bar-bg"><div class="bar-fill" style="width:${h.total?Math.max(0,Math.min(100,h.score/h.total*100)):0}%"></div></div></div>`).join(""):`<div class="empty muted">Complete a practice set or mock test to start your score history.</div>`;root.innerHTML=`<div class="card hero"><span class="eyebrow">Your practice workspace</span><h2>${exam} · ${esc(EXAMS[exam].subject)}</h2><p>${esc(EXAMS[exam].description)}</p><div class="btn-row">${btn("Start practising","start",true)} ${btn("Take a mock test","setup")}</div></div><div class="grid">${stat("Questions solved",total,"Across all olympiads")}${stat("Correct answers",correct,"From checked questions")}${stat("Overall accuracy",total?Math.round(correct/total*100)+"%":"—","Based on attempted questions")}${stat(exam+" accuracy",done().length?accuracy()+"%":"—",done().length+" questions checked")}</div><div class="grid two"><div class="card"><h2>${exam} score history</h2>${bars}</div><div class="card"><h2>Suggested next steps</h2><div class="list-row"><strong>1. Practise a section</strong><p class="muted">Focus on one topic and review each solution carefully.</p>${btn("Choose section","sections")}</div><div class="list-row"><strong>2. Take a timed set</strong><p class="muted">Use a mock to practise accuracy under time pressure.</p>${btn("Mock test options","setup")}</div><div class="list-row"><strong>3. Review mistakes</strong><p class="muted">Revisit questions you answered incorrectly.</p>${btn("All questions","questions")}</div></div></div><div class="card"><h2>Choose an olympiad</h2><div class="section-grid">${Object.keys(EXAMS).map(e=>`<button class="section-card" data-exam="${e}"><strong>${e} · ${esc(EXAMS[e].subject)}</strong><span class="muted">${qs(e).length} starter questions available</span></button>`).join("")}</div><p class="footer-note">Starter questions are examples, not official past-paper questions. Your scores are stored locally in this browser.</p></div>`}
function about(){page("About Us","A small practice lab built for students.");root.innerHTML=`<div class="card hero"><span class="eyebrow">Think · Solve · Grow</span><h2>Olympiad Problem Lab</h2><p>A student-focused practice space for building concepts, problem-solving habits, and exam confidence.</p></div><div class="card"><h2>What you can do here</h2><ul><li>Practise simple multiple-choice questions.</li><li>Choose sections for focused practice.</li><li>Try short full or section-wise mock tests.</li><li>Review hints, solutions, and your local score history.</li></ul><p class="muted">This is an independent student project, not an official IOQM, NSEP, NSEC, NSEB, or exam-organiser website. Starter questions are illustrative examples.</p></div>`}
function questionList(){page("All Questions","Browse available questions and continue practising.");root.innerHTML=`<div class="card"><h2>Question bank</h2><div class="field"><label>Olympiad</label><select id="filterExam">${Object.keys(EXAMS).map(e=>`<option ${e===exam?"selected":""}>${e}</option>`).join("")}</select></div><div class="field"><label>Section</label><select id="filterSection"><option value="ALL">All sections</option>${secList(exam).map(s=>`<option>${esc(s)}</option>`).join("")}</select></div><div id="questionRows"></div></div>`;renderQuestionRows()}
function renderQuestionRows(){let e=$("filterExam")?.value||exam,s=$("filterSection")?.value||"ALL";let list=qs(e).filter(q=>s==="ALL"||q.section===s);$("questionRows").innerHTML=list.length?list.map((q,i)=>`<div class="list-row"><span class="tag">${esc(q.section)}</span><p><strong>${i+1}. ${esc(q.question)}</strong></p><div class="muted">Status: ${data.attempts[q.id]?.checked?(data.attempts[q.id].correct?"Correct":"Attempted"):"Not attempted"}</div><div class="btn-row"><button class="btn primary" data-openq="${esc(q.id)}" data-qexam="${e}">Open question</button></div></div>`).join(""):`<div class="empty">No questions in this section yet.</div>`}
function examPage(){page(exam+" Practice",EXAMS[exam].subject+" · "+EXAMS[exam].description);root.innerHTML=`<div class="card"><div class="row between wrap"><div><span class="tag">${exam}</span><h2 style="margin-top:10px">Practice centre</h2><p class="muted">${esc(EXAMS[exam].description)}</p></div></div><div class="tabs"><button class="tab ${mode==="simple"?"active":""}" data-mode="simple">Simple Questions</button><button class="tab ${mode==="section"?"active":""}" data-mode="section">Section-wise Practice</button><button class="tab ${mode==="setup"?"active":""}" data-mode="setup">Full Mock Tests</button></div><div id="examPanel"></div></div>`;panel()}
function panel(){let p=$("examPanel");if(mode==="setup"){p.innerHTML=`<h3>Mock test setup</h3><p class="muted">These are short practice mocks made from the available starter questions, not official-length exams.</p><div class="field"><label>Test type</label><select id="testKind"><option value="full">Full mock · all available sections</option><option value="section">Section-wise mock</option></select></div><div class="field"><label>Section (for section-wise mock)</label><select id="testSection">${secList().map(s=>`<option>${esc(s)}</option>`).join("")}</select></div><div class="field"><label>Time limit</label><select id="testDuration"><option value="5">5 minutes</option><option value="10" selected>10 minutes</option><option value="20">20 minutes</option></select></div><button class="btn primary" data-action="beginTest">Start mock test</button>`;return}
if(mode==="section"){p.innerHTML=`<h3>Choose a section</h3><div class="section-grid">${secList().map(s=>`<button class="section-card" data-section="${esc(s)}"><strong>${esc(s)}</strong><span class="muted">${qs().filter(q=>q.section===s).length} available questions</span></button>`).join("")}</div>`;return}
let list=qs();if(!list.length){p.innerHTML=`<div class="empty">No questions are available for this olympiad yet.</div>`;return}idx=Math.max(0,Math.min(idx,list.length-1));p.innerHTML=questionHTML(list[idx],idx,list.length)}
function questionHTML(q,n,total){let a=data.attempts[q.id],sel=selected[q.id]??(a?.checked?a.choice:null),show=!!revealed[q.id];return `<div class="row between wrap"><span class="tag">${esc(q.section)}</span><span class="muted">Question ${n+1} of ${total}</span></div><div class="problem">${esc(q.question)}</div>${q.options.map((o,i)=>`<label class="option ${a?.checked&&i===q.answer?"good":a?.checked&&i===sel&&sel!==q.answer?"bad":""}"><input type="radio" name="answer" value="${i}" ${sel===i?"checked":""}><span>${esc(o)}</span></label>`).join("")}<div class="btn-row"><button class="btn" data-action="hint" data-qid="${esc(q.id)}">Show hint</button><button class="btn" data-action="solution" data-qid="${esc(q.id)}">Show solution</button><button class="btn primary" data-action="check" data-qid="${esc(q.id)}">Check answer</button></div>${show?`<div class="feedback">${esc(show==="hint"?q.hint:q.solution)}</div>`:""}${a?.checked?`<div class="feedback ${a.correct?"good":"bad"}">${a.correct?"Correct!":"Not quite."} ${esc(q.solution)}</div>`:""}<div class="btn-row">${btn("Previous","prev")} ${btn("Next question","next",true)} ${btn("Back to dashboard","dashboard")}</div>`}
function feedbackPage(){page("Query / Feedback","Save a note or suggestion on this device.");root.innerHTML=`<div class="card"><h2>Send feedback</h2><p class="muted">This demo stores feedback in this browser only. It does not send anything to the site owner.</p><div class="field"><label>Type</label><select id="fbType"><option>Suggestion</option><option>Report a question error</option><option>Bug report</option><option>Other</option></select></div><div class="field"><label>Your message</label><textarea id="fbMessage" placeholder="Describe your suggestion or issue..."></textarea></div><button class="btn primary" data-action="saveFeedback">Save feedback locally</button></div><div class="card"><h2>Saved feedback</h2>${data.feedback.length?data.feedback.slice().reverse().map(f=>`<div class="history-item"><strong>${esc(f.type)}</strong><div class="muted">${esc(f.date)}</div><p>${esc(f.message)}</p></div>`).join(""):`<div class="empty muted">No saved feedback yet.</div>`}</div>`}
function render(){nav();if(view==="dashboard")dashboard();else if(view==="about")about();else if(view==="questions")questionList();else if(view==="feedback")feedbackPage();else examPage()}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function beginTest(){let kind=$("testKind").value,sec=$("testSection").value;let list=qs().filter(q=>kind==="full"||q.section===sec);if(!list.length){toast("No questions available for that selection.");return}stopTimer();test={exam,kind,section:kind==="section"?sec:"All sections",ids:list.map(q=>q.id),answers:{},end:Date.now()+Number($("testDuration").value)*60000};view="test";renderTest();timer=setInterval(()=>{if(!test)return;let left=Math.max(0,test.end-Date.now());let el=$("countdown");if(el)el.textContent=formatTime(left);if(left<=0)submitTest(true)},500)}
function formatTime(ms){let n=Math.ceil(ms/1000);return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function renderTest(){page(exam+" Mock Test",test?test.section+" · timed practice":"Mock test");let list=test.ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean);root.innerHTML=`<div class="card"><div class="row between wrap"><div><span class="tag">${esc(test.exam)} · ${esc(test.kind==="full"?"Full mock":"Section mock")}</span><p class="muted">${list.length} questions · answers are saved when you submit</p></div><div class="timer" id="countdown">${formatTime(test.end-Date.now())}</div></div>${list.map((q,i)=>`<div class="list-row"><strong>${i+1}. ${esc(q.question)}</strong>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="t_${esc(q.id)}" value="${j}" ${test.answers[q.id]===j?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div>`).join("")}<div class="btn-row"><button class="btn primary" data-action="submitTest">Submit test</button><button class="btn" data-action="cancelTest">Cancel test</button></div></div>`}
function submitTest(auto=false){if(!test)return;stopTimer();let list=test.ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean),score=0;list.forEach(q=>{let choice=test.answers[q.id];if(choice===q.answer)score++;data.attempts[q.id]={checked:true,choice,correct:choice===q.answer,date:new Date().toISOString()}});data.history.push({exam:test.exam,mode:test.kind==="full"?"Full mock":"Section mock",section:test.section,score,total:list.length,date:new Date().toLocaleDateString()});let summary={exam:test.exam,score,total:list.length,mode:test.kind==="full"?"Full mock":"Section mock"};test=null;save();view="result";result(summary,auto)}
function result(r,auto){page("Test Results",r.exam+" · "+r.mode);root.innerHTML=`<div class="card hero"><span class="eyebrow">${auto?"Time is up":"Test submitted"}</span><h2>${r.score} / ${r.total}</h2><p>${r.total?Math.round(r.score/r.total*100):0}% correct. Review the questions and learn from any mistakes.</p><div class="btn-row">${btn("Dashboard","dashboard")} ${btn("Try another test","setup")}</div></div><div class="card"><h2>Recent test history</h2>${history(r.exam).slice(-8).reverse().map(h=>`<div class="history-item"><strong>${esc(h.mode)} · ${h.score}/${h.total}</strong><div class="muted">${esc(h.date)} · ${esc(h.section||"All sections")}</div></div>`).join("")}</div>`}
function openQuestion(id,e){exam=e;view="exam";mode="simple";idx=Math.max(0,qs(e).findIndex(q=>q.id===id));render()}
function onClick(ev){let b=ev.target.closest("button");if(!b)return;if(b.dataset.view){go(b.dataset.view);return}if(b.dataset.exam){pickExam(b.dataset.exam);return}if(b.id==="olympiadsToggle"){expanded=!expanded;nav();return}if(b.id==="topMenuBtn"){expanded=!expanded;nav();return}if(b.dataset.mode){mode=b.dataset.mode;panel();return}if(b.dataset.section){section=b.dataset.section;mode="simple";idx=0;let list=qs().filter(q=>q.section===section);if(!list.length){toast("No questions in this section yet.");return}root.innerHTML=`<div class="card"><div class="row between"><h2>${esc(section)}</h2>${btn("All sections","sections")}</div>${questionHTML(list[0],0,list.length)}</div>`;return}if(b.dataset.openq){openQuestion(b.dataset.openq,b.dataset.qexam);return}if(b.dataset.action){let a=b.dataset.action;if(a==="dashboard"){go("dashboard");return}if(a==="start"){view="exam";mode="simple";idx=0;render();return}if(a==="setup"){view="exam";mode="setup";render();return}if(a==="sections"){view="exam";mode="section";render();return}if(a==="prev"){idx=Math.max(0,idx-1);panel();return}if(a==="next"){idx=(idx+1)%Math.max(1,qs().length);panel();return}if(a==="hint"||a==="solution"){revealed[b.dataset.qid]=a==="hint"?"hint":"solution";panel();return}if(a==="check"){let q=questions.find(q=>q.id===b.dataset.qid),chosen=document.querySelector('input[name="answer"]:checked');if(!chosen){toast("Choose an answer first.");return}let choice=Number(chosen.value);selected[q.id]=choice;data.attempts[q.id]={checked:true,choice,correct:choice===q.answer,date:new Date().toISOString()};save();panel();return}if(a==="beginTest"){beginTest();return}if(a==="submitTest"){submitTest(false);return}if(a==="cancelTest"){stopTimer();test=null;view="exam";mode="setup";render();return}if(a==="saveFeedback"){let message=$("fbMessage").value.trim();if(!message){toast("Write a message first.");return}data.feedback.push({type:$("fbType").value,message,date:new Date().toLocaleString()});save();feedbackPage();toast("Saved on this device.");return}}}
document.addEventListener("click",onClick);
document.addEventListener("change",ev=>{if(ev.target.name==="answer"){let q=qs()[idx];if(q)selected[q.id]=Number(ev.target.value)}if(ev.target.name?.startsWith("t_")&&test){let id=ev.target.name.slice(2);test.answers[id]=Number(ev.target.value)}if(ev.target.id==="filterExam"){let e=ev.target.value;exam=e;$("filterSection").innerHTML='<option value="ALL">All sections</option>'+secList(e).map(s=>`<option>${esc(s)}</option>`).join("");renderQuestionRows()}if(ev.target.id==="filterSection")renderQuestionRows()});
async function loadPublished(){if(!db)return;try{let {data:rows,error}=await db.from("questions").select("*").eq("published",true).order("created_at",{ascending:false});if(error)throw error;let mapped=(rows||[]).map(r=>({id:"sb-"+r.id,olympiad:"IOQM",section:r.topic==="NT"?"Number Theory (NT)":r.topic,topic:r.difficulty||r.topic,question:r.question,options:Array.isArray(r.options)?r.options:[],answer:Number(r.answer_index),hint:r.hint||"",solution:r.solution||""})).filter(q=>q.options.length===4&&q.answer>=0&&q.answer<4);let ids=new Set(questions.map(q=>q.id));questions.push(...mapped.filter(q=>!ids.has(q.id)));if(view==="questions")questionList();else if(view==="dashboard")dashboard();else if(view==="exam")examPage()}catch(e){console.warn("Published questions could not be loaded:",e.message)}}
render();loadPublished();
</script>
</body>
