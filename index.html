
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Olympiad Problem Lab</title>

<style>
:root {
  --navy:#142343;
  --navy2:#1d3155;
  --blue:#3559ed;
  --light:#f3f6ff;
  --border:#d8e1f5;
  --text:#172544;
  --muted:#687895;
  --green:#159c64;
  --red:#d94b4b;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--light);
  color:var(--text);
}
button,input,select,textarea {font:inherit}
button {cursor:pointer}
button:disabled {opacity:.45;cursor:not-allowed}
.app {min-height:100vh;display:flex}
.sidebar {
  width:255px;flex-shrink:0;
  background:var(--navy);color:white;
  padding:20px 13px;
  display:flex;flex-direction:column;
}
.brand {
  font-size:20px;font-weight:bold;
  padding:8px 10px 20px;
  border-bottom:1px solid #405172;
  line-height:1.3;
}
.brand small {
  display:block;font-size:12px;font-weight:normal;
  color:#bdc9e6;margin-top:6px;
}
.nav-label {
  color:#aebde0;font-size:11px;
  letter-spacing:1.2px;text-transform:uppercase;
  margin:23px 10px 8px;
}
.nav,.exam-nav {
  display:flex;align-items:center;gap:10px;
  width:100%;border:0;border-radius:9px;
  padding:12px 11px;margin:3px 0;
  color:#dbe4ff;background:transparent;
  text-align:left;font-size:14px;
}
.nav:hover,.exam-nav:hover {background:#25375e}
.nav.active,.exam-nav.active {background:var(--blue);color:white}
.nav .arrow {margin-left:auto}
.exam-list {display:none;padding-left:9px}
.exam-list.open {display:block}
.exam-nav {font-size:13px;padding:10px}
.exam-nav small {display:block;color:#c5d2f1;margin-top:3px}
.sidebar-footer {
  margin-top:auto;color:#aebde0;
  font-size:11px;padding:18px 9px 4px;
}
.main {flex:1;min-width:0}
.topbar {
  background:white;border-bottom:1px solid var(--border);
  padding:19px 26px;display:flex;align-items:center;
  justify-content:space-between;gap:15px;
}
.topbar h1 {font-size:23px;margin:0 0 6px}
.topbar p {font-size:13px;color:var(--muted);margin:0}
.top-actions {display:flex;gap:8px;align-items:center}
.score-pill {
  background:#e8eeff;color:#2444bd;
  padding:11px 13px;border-radius:11px;
  font-size:13px;font-weight:bold;white-space:nowrap;
}
.menu-toggle {display:none}
.content {max-width:1150px;margin:auto;padding:24px}
.card {
  background:white;border:1px solid var(--border);
  border-radius:15px;padding:21px;margin-bottom:17px;
  min-width:0;
}
.hero {
  background:linear-gradient(135deg,#142343,#3559ed);
  color:white;border:0;padding:27px;
}
.hero h2 {margin:8px 0;font-size:27px}
.hero p {color:#dbe4ff;line-height:1.6}
.eyebrow {
  font-size:11px;letter-spacing:1.2px;
  text-transform:uppercase;font-weight:bold;
}
.grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.grid.two {grid-template-columns:repeat(2,minmax(0,1fr))}
.stat {padding:17px}
.stat .number {font-size:27px;font-weight:bold;margin:9px 0}
.stat .label {font-size:12px;color:var(--muted)}
.stat .symbol {font-size:20px}
.row {display:flex;align-items:center;gap:10px}
.between {justify-content:space-between}
.wrap {flex-wrap:wrap}
.grow {flex:1;min-width:0}
.muted {color:var(--muted);font-size:13px;line-height:1.6}
.small {font-size:12px}
h2 {font-size:20px;margin:0 0 12px}
h3 {font-size:16px;margin:0 0 9px}
p {line-height:1.65}
.btn {
  border:1px solid var(--border);background:white;color:var(--text);
  padding:10px 13px;border-radius:9px;font-size:13px;
}
.btn:hover {border-color:#8299df}
.btn.primary {background:var(--blue);color:white;border-color:var(--blue)}
.btn.dark {background:var(--navy);color:white;border-color:var(--navy)}
.btn.danger {color:var(--red)}
.btn.full {width:100%}
.btn-row {display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.tabs {display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}
.tab {
  padding:10px 12px;border:1px solid var(--border);
  border-radius:9px;background:white;font-size:13px;
}
.tab.active {background:var(--navy);color:white;border-color:var(--navy)}
.section-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.section-card {
  text-align:left;border:1px solid var(--border);
  border-radius:12px;padding:16px;background:white;color:var(--text);
}
.section-card:hover {border-color:var(--blue);background:#f8f9ff}
.section-card strong {display:block;margin-bottom:7px}
.tag {
  display:inline-block;background:#e9edff;color:#2946bd;
  padding:6px 9px;border-radius:20px;font-size:11px;font-weight:bold;
}
.field {margin:13px 0}
.field label {display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
.field input,.field select,.field textarea {
  width:100%;padding:11px;border:1px solid var(--border);
  border-radius:9px;background:white;color:var(--text);
}
.field textarea {min-height:120px;resize:vertical}
.problem {font-size:19px;line-height:1.7;margin:22px 0}
.option {
  display:flex;align-items:flex-start;gap:10px;
  padding:13px;margin:9px 0;border:1px solid var(--border);
  border-radius:10px;cursor:pointer;line-height:1.5;
}
.option:hover {background:#f7f8ff}
.option input {margin-top:4px;accent-color:var(--blue)}
.option.correct {border-color:var(--green);background:#eafaf2}
.option.wrong {border-color:var(--red);background:#fff0f0}
.feedback {
  padding:13px;border-radius:9px;margin-top:12px;
  background:#edf2ff;line-height:1.65;white-space:pre-wrap;
}
.feedback.good {background:#eafaf2}
.feedback.bad {background:#fff0f0}
.list-row {
  padding:14px 0;border-bottom:1px solid var(--border);
}
.list-row:last-child {border-bottom:0}
.bar-row {margin:15px 0}
.bar-head {display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:7px}
.bar-bg {height:9px;background:#e8edf8;border-radius:9px;overflow:hidden}
.bar-fill {height:100%;background:var(--blue);border-radius:9px}
.history-item {
  border:1px solid var(--border);border-radius:10px;
  padding:13px;margin:9px 0;
}
.empty {
  padding:22px;text-align:center;background:#f8faff;
  border:1px dashed #c5d2eb;border-radius:12px;
}
.timer {font-size:22px;font-weight:bold;color:var(--blue)}
.toast {
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:white;padding:12px 17px;
  border-radius:10px;z-index:10;display:none;max-width:90%;
  font-size:13px;
}
.footer-note {font-size:11px;color:var(--muted);margin:15px 0}
@media(max-width:900px) {
  .grid {grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:650px) {
  .app {display:block}
  .sidebar {width:100%;padding:12px}
  .brand {padding:6px 8px 13px}
  .nav-label {margin:14px 8px 5px}
  .nav {display:inline-flex;width:auto;margin:2px;padding:10px}
  .exam-list {padding-left:0}
  .exam-nav {display:inline-flex;width:auto;vertical-align:top}
  .exam-nav small {display:none}
  .sidebar-footer {display:none}
  .topbar {padding:15px;align-items:flex-start}
  .topbar h1 {font-size:19px}
  .topbar p {font-size:12px}
  .menu-toggle {display:inline-block}
  .score-pill {font-size:11px;padding:9px}
  .content {padding:12px}
  .card {padding:16px}
  .hero {padding:20px}
  .hero h2 {font-size:23px}
  .grid {gap:9px}
  .stat {padding:12px}
  .stat .number {font-size:23px}
  .section-grid {grid-template-columns:1fr}
  .problem {font-size:17px}
}
</style>
</head>

/* ===== LOCAL STUDENT DATA ===== */
function freshProgress() {
  return {attempts:{},history:[],bookmarks:[],goals:{},feedbackDrafts:[]};
}
function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!saved || typeof saved !== "object") return freshProgress();
    return {
      ...freshProgress(),...saved,
      attempts:saved.attempts || {},
      history:Array.isArray(saved.history)?saved.history:[],
      bookmarks:Array.isArray(saved.bookmarks)?saved.bookmarks:[],
      goals:saved.goals || {},
      feedbackDrafts:Array.isArray(saved.feedbackDrafts)?saved.feedbackDrafts:[]
    };
  } catch (e) { return freshProgress(); }
}
let progress = loadProgress();
function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));
    updateHeader();
  } catch (e) {
    notify("Browser storage is full or unavailable. Export your progress or clear some browser storage.");
  }
}
function updateHeader() {
  const el = document.getElementById("headerSolved");
  if (el) el.textContent = Object.values(progress.attempts).filter(a=>a.checked).length;
}
function notify(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(notify.timer);
  notify.timer = setTimeout(()=>el.style.display="none",2800);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}
function prettyDate(value) {
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? "Unknown date" :
    d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}

function accuracyFor(exam) {

  return Math.round(100*done.filter(q=>progress.attempts[q.id].correct).length/done.length);

    ${extra?`<div class="muted small">${escapeHTML(extra)}</div>`:""}</div>`;
