<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="#142343" name="theme-color"/>
  <title>
   Olympiad Problem Lab | Practice Workspace
  </title>
  <style>
   :root {
  --navy: #142343;
  --navy2: #20365d;
  --blue: #3559ed;
  --light: #f3f6ff;
  --border: #d8e1f5;
  --text: #172544;
  --muted: #687895;
  --green: #159c64;
  --red: #d94b4b
}
* {
  box-sizing: border-box
}
body {
  margin: 0;
  font-family: Arial,sans-serif;
  background: var(--light);
  color: var(--text)
}
button,input,select,textarea {
  font: inherit
}
button {
  cursor: pointer
}
button:disabled {
  opacity: .5;
  cursor: not-allowed
}
.app {
  min-height: 100vh;
  display: flex
}
.sidebar {
  width: 245px;
  flex-shrink: 0;
  background: var(--navy);
  color: white;
  padding: 16px 12px;
  display: flex;
  flex-direction: column
}
.brand {
  font-size: 19px;
  font-weight: bold;
  padding: 8px 8px 18px;
  border-bottom: 1px solid #405172
}
.brand small {
  display: block;
  font-size: 12px;
  font-weight: normal;
  color: #bdc9e6;
  margin-top: 6px
}
.nav-label {
  color: #aebde0;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin: 20px 9px 7px
}
.nav,.exam-nav {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 11px;
  color: #dbe4ff;
  background: transparent;
  text-align: left;
  margin: 2px 0;
  font-size: 14px
}
.nav:hover,.exam-nav:hover {
  background: #25375e
}
.nav.active,.exam-nav.active {
  background: var(--blue);
  color: white
}
.arrow {
  margin-left: auto
}
.exam-list {
  display: none;
  padding-left: 8px
}
.exam-list.open {
  display: block
}
.exam-nav {
  font-size: 13px;
  padding: 9px
}
.exam-nav small {
  display: block;
  color: #c5d2f1;
  margin-top: 3px
}
.sidebar-footer {
  margin-top: auto;
  color: #aebde0;
  font-size: 11px;
  padding: 18px 8px 4px
}
.main {
  flex: 1;
  min-width: 0
}
.topbar {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 17px 23px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px
}
.topbar h1 {
  font-size: 22px;
  margin: 0 0 5px
}
.topbar p {
  font-size: 12px;
  color: var(--muted);
  margin: 0
}
.row {
  display: flex;
  align-items: center;
  gap: 9px
}
.score-pill {
  background: #e8eeff;
  color: #2444bd;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap
}
.content {
  max-width: 1100px;
  margin: auto;
  padding: 22px
}
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 19px;
  margin-bottom: 15px;
  min-width: 0
}
.hero {
  background: linear-gradient(135deg,#142343,#3559ed);
  color: white;
  border: 0;
  padding: 25px
}
.hero h2 {
  font-size: 26px;
  margin: 8px 0
}
.hero p {
  color: #dbe4ff;
  line-height: 1.6
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: bold
}
.grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 12px
}
.grid.two {
  grid-template-columns: repeat(2,minmax(0,1fr))
}
.stat {
  padding: 15px
}
.number {
  font-size: 26px;
  font-weight: bold;
  margin: 9px 0
}
.muted {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6
}
.small {
  font-size: 12px
}
h2 {
  font-size: 20px;
  margin: 0 0 12px
}
h3 {
  font-size: 16px;
  margin: 0 0 9px
}
p {
  line-height: 1.6
}
.btn {
  border: 1px solid var(--border);
  background: white;
  color: var(--text);
  padding: 10px 12px;
  border-radius: 9px;
  font-size: 13px
}
.btn:hover {
  border-color: #8299df
}
.btn.primary {
  background: var(--blue);
  color: white;
  border-color: var(--blue)
}
.btn.dark {
  background: var(--navy);
  color: white
}
.btn.danger {
  color: var(--red)
}
.btn-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 13px
}
.tabs {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 15px
}
.tab {
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  font-size: 13px
}
.tab.active {
  background: var(--navy);
  color: white
}
.section-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px
}
.section-card {
  text-align: left;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 15px;
  background: white;
  color: var(--text)
}
.section-card:hover {
  border-color: var(--blue);
  background: #f8f9ff
}
.section-card strong {
  display: block;
  margin-bottom: 6px
}
.tag {
  display: inline-block;
  background: #e9edff;
  color: #2946bd;
  padding: 5px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold
}
.field {
  margin: 12px 0
}
.field label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px
}
.field input,.field select,.field textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text)
}
.field textarea {
  min-height: 100px;
  resize: vertical
}
.problem {
  font-size: 18px;
  line-height: 1.7;
  margin: 20px 0
}
.option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  line-height: 1.5
}
.option:hover {
  background: #f7f8ff
}
.option input {
  margin-top: 4px;
  accent-color: var(--blue)
}
.feedback {
  padding: 12px;
  border-radius: 9px;
  margin-top: 12px;
  background: #edf2ff;
  line-height: 1.6;
  white-space: pre-wrap
}
.good {
  background: #eafaf2!important
}
.bad {
  background: #fff0f0!important
}
.list-row {
  padding: 12px 0;
  border-bottom: 1px solid var(--border)
}
.list-row:last-child {
  border-bottom: 0
}
.bar-row {
  margin: 14px 0
}
.bar-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  margin-bottom: 6px
}
.bar-bg {
  height: 9px;
  background: #e8edf8;
  border-radius: 9px;
  overflow: hidden
}
.bar-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 9px
}
.history-item {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin: 8px 0
}
.empty {
  padding: 20px;
  text-align: center;
  background: #f8faff;
  border: 1px dashed #c5d2eb;
  border-radius: 12px
}
.timer {
  font-size: 21px;
  font-weight: bold;
  color: var(--blue)
}
.toast {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: white;
  padding: 12px 16px;
  border-radius: 10px;
  z-index: 10;
  display: none;
  max-width: 90%;
  font-size: 13px
}
.footer-note {
  font-size: 11px;
  color: var(--muted);
  margin: 14px 0
}
.menu-toggle {
  display: none
}
@media(max-width:850px) {
  .grid {
    grid-template-columns: repeat(2,minmax(0,1fr))
  }
}
@media(max-width:650px) {
  .app {
    display: block
  }
  .sidebar {
    width: 100%;
    padding: 10px
  }
  .brand {
    padding: 5px 7px 11px
  }
  .nav-label {
    margin: 12px 7px 5px
  }
  .nav {
    display: inline-flex;
    width: auto;
    padding: 9px 10px;
    font-size: 12px
  }
  .exam-list {
    padding-left: 0
  }
  .exam-nav {
    display: inline-flex;
    width: auto;
    vertical-align: top;
    padding: 8px
  }
  .exam-nav small {
    display: none
  }
  .sidebar-footer {
    display: none
  }
  .topbar {
    padding: 13px;
    align-items: flex-start
  }
  .topbar h1 {
    font-size: 18px
  }
  .menu-toggle {
    display: inline-block
  }
  .content {
    padding: 11px
  }
  .card {
    padding: 15px
  }
  .hero {
    padding: 19px
  }
  .hero h2 {
    font-size: 22px
  }
  .grid {
    gap: 8px
  }
  .stat {
    padding: 11px
  }
  .number {
    font-size: 22px
  }
  .section-grid {
    grid-template-columns: 1fr
  }
  .problem {
    font-size: 16px
  }
}

function renderTest() { page(exam + " Mock Test", test ? test.section + " · timed practice" : "Mock test"); let list = test.ids.map(id => questions.find(q => q.id === id)).filter(Boolean); root.innerHTML = `<div class="card"><div class="row between wrap"><div><span class="tag">${esc(test.exam)} · ${esc(test.kind === "full" ? "Full mock" : "Section mock")}</span><p class="muted">${list.length} questions · answers are saved when you submit</p></div><div class="timer" id="countdown">${formatTime(test.end - Date.now())}</div></div>${list.map((q, i) => `<div class="list-row"><div class="muted difficulty-label">Difficulty: ${esc(q.difficulty || "Not set")}</div><strong>${i + 1}. ${esc(q.question)}</strong>${q.options.map((o, j) => `<label class="option"><input type="radio" name="t_${esc(q.id)}" value="${j}" ${test.answers[q.id] === j ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>`).join("")}<div class="btn-row"><button class="btn primary" data-action="submitTest">Submit practice</button><button class="btn" data-action="cancelTest">Cancel test</button></div></div>`; }
function submitTest(auto = false) {
  if (!test)
    return; stopTimer(); let list = test.ids.map(id => questions.find(q => q.id === id)).filter(Boolean), score = 0; list.forEach(q => {
      let choice = test.answers[q.id]; if (choice === q.answer)
        score++; data.attempts[q.id] = { checked: true, choice, correct: choice === q.answer, date: new Date().toISOString() };
    }); data.history.push({ exam: test.exam, mode: test.kind === "full" ? "Full mock" : "Section mock", section: test.section, score, total: list.length, date: new Date().toLocaleDateString() }); let summary = { exam: test.exam, score, total: list.length, mode: test.kind === "full" ? "Full mock" : "Section mock" }; test = null; save(); view = "result"; result(summary, auto);
}
function result(r, auto) { page("Test Results", r.exam + " · " + r.mode); root.innerHTML = `<div class="card hero"><span class="eyebrow">${auto ? "Time is up" : "Test submitted"}</span><h2>${r.score} / ${r.total}</h2><p>${r.total ? Math.round(r.score / r.total * 100) : 0}% correct. Review the questions and learn from any mistakes.</p><div class="btn-row">${btn("Dashboard", "dashboard")} ${btn("Try another test", "setup")}</div></div><div class="card"><h2>Recent test history</h2>${history(r.exam).slice(-8).reverse().map(h => `<div class="history-item"><strong>${esc(h.mode)} · ${h.score}/${h.total}</strong><div class="muted">${esc(h.date)} · ${esc(h.section || "All sections")}</div></div>`).join("")}</div>`; }
function openQuestion(id, e) { exam = e; view = "exam"; mode = "simple"; idx = Math.max(0, qs(e).findIndex(q => q.id === id)); render(); }
function onClick(ev) {
  let b = ev.target.closest("button");
  if (!b)
    return;
  if (b.dataset.view) {
    go(b.dataset.view);
    return;
  }
  if (b.dataset.exam) {
    pickExam(b.dataset.exam);
    return;
  }
  if (b.id === "olympiadsToggle") {
    expanded = !expanded;
    nav();
    return;
  }
  if (b.id === "drawerBackdrop") {
    drawerOpen = false;
    nav();
    return;
  }
  if (b.dataset.settest) {
    let [key, value] = b.dataset.settest.split(":");
    if (key === "kind") {
      $("testKind").value = value;
      document.querySelectorAll('[data-settest^="kind:"]').forEach(x => x.classList.toggle("selected", x === b));
      $("sectionChoices").style.opacity = value === "section" ? "1" : ".55";
      $("sectionChoices").style.pointerEvents = value === "section" ? "auto" : "none";
    }
    else if (key === "section") {
      $("testSection").value = value;
      document.querySelectorAll('[data-settest^="section:"]').forEach(x => x.classList.toggle("selected", x === b));
    }
    else if (key === "duration") {
      $("testDuration").value = value;
      document.querySelectorAll('[data-settest^="duration:"]').forEach(x => x.classList.toggle("selected", x === b));
    }
    return;
  }
  if (b.id === "topMenuBtn") {
    drawerOpen = !drawerOpen;
    nav();
    return;
  }
  if (b.dataset.mode) {
    mode = b.dataset.mode;
    panel();
    return;
  }
  if (b.dataset.section) {
    section = b.dataset.section;
    mode = "simple";
    idx = 0;
    let list = qs().filter(q => q.section === section);
    if (!list.length) {
      toast("No questions in this section yet.");
      return;
    }
    root.innerHTML = `<div class="card"><div class="row between"><h2>${esc(section)}</h2>${btn("All sections", "sections")}</div>${questionHTML(list[0], 0, list.length)}</div>`;
    return;
  }
  if (b.dataset.openq) {
    openQuestion(b.dataset.openq, b.dataset.qexam);
    return;
  }
  if (b.dataset.action) {
    let a = b.dataset.action;
    if (a === "dashboard") {
      go("dashboard");
      return;
    }
    if (a === "start") {
      view = "exam";
      mode = "simple";
      idx = 0;
      render();
      return;
    }
    if (a === "setup") {
      view = "exam";
      mode = "setup";
      render();
      return;
    }
    if (a === "sections") {
      view = "exam";
      mode = "section";
      render();
      return;
    }
    if (a === "prev") {
      idx = Math.max(0, idx - 1);
      panel();
      return;
    }
    if (a === "next") {
      idx = (idx + 1) % Math.max(1, qs().length);
      panel();
      return;
    }
    if (a === "hint" || a === "solution") {
      revealed[b.dataset.qid] = a === "hint" ? "hint" : "solution";
      panel();
      return;
    }
    if (a === "check") {
      let q = questions.find(q => q.id === b.dataset.qid);
      if (!q) return;
      let choice, correct;
      if (q.question_type === "INTEGER") {
        const input = $("integerResponse"), raw = input?.value.trim();
        if (raw === "" || !Number.isSafeInteger(Number(raw))) { toast("Enter an integer answer first."); return; }
        choice = Number(raw); correct = choice === Number(q.integer_answer);
      } else if (q.question_type === "MULTIPLE_CORRECT") {
        const chosen = [...document.querySelectorAll('input[name="answer"]:checked')].map(el => Number(el.value));
        if (!chosen.length) { toast("Select at least one answer."); return; }
        choice = chosen.sort((a,b) => a-b); const expected = [...(q.correct_indices || [])].map(Number).sort((a,b) => a-b);
        correct = choice.length === expected.length && choice.every((v,i) => v === expected[i]);
      } else {
        const chosen = document.querySelector('input[name="answer"]:checked');
        if (!chosen) { toast("Choose an answer first."); return; }
        choice = Number(chosen.value); correct = choice === q.answer;
      }
      selected[q.id] = choice;
      data.attempts[q.id] = { checked: true, choice, correct, date: new Date().toISOString() };
      save();
      panel();
      return;
    }
    if (a === "beginTest") {
      beginTest();
      return;
    }
    if (a === "submitTest") {
      submitTest(false);
      return;
    }
    if (a === "cancelTest") {
      stopTimer();
      test = null;
      view = "exam";
      mode = "setup";
      render();
      return;
    }
    if (a === "saveFeedback") {
      let message = $("fbMessage").value.trim();
      if (!message) {
        toast("Write a message first.");
        return;
      }
      data.feedback.push({ type: $("fbType").value, message, date: new Date().toLocaleString() });
      save();
      feedbackPage();
      toast("Saved on this device.");
      return;
    }
  }
}
document.addEventListener("click", onClick);
$("drawerBackdrop").addEventListener("click", () => { drawerOpen = false; nav(); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && drawerOpen) {
    drawerOpen = false;
    nav();
  }
});
document.addEventListener("change", ev => {
  if (ev.target.name === "answer") {
    let q = qs()[idx];
    if (q)
      selected[q.id] = Number(ev.target.value);
  } if (ev.target.name?.startsWith("t_") && test) {
    let id = ev.target.name.slice(2);
    test.answers[id] = Number(ev.target.value);
  } if (ev.target.id === "filterExam") {
    let e = ev.target.value;
    exam = e;
    $("filterSection").innerHTML = '<option value="ALL">All sections</option>' + secList(e).map(s => `<option>${esc(s)}</option>`).join("");
    renderQuestionRows();
  } if (ev.target.id === "filterSection")
    renderQuestionRows(); if (ev.target.id === "theoryExam") {
      exam = ev.target.value;
      learningContentPage("THEORY");
    }
});
async function loadPublished() {
  if (!db)
    return; try {
      let { data: rows, error } = await db.from("questions").select("*").eq("published", true);
      if (error)
        throw error;
      const mapped = (rows || []).map(r => {
        const type = String(r.question_type || "MCQ").toUpperCase();
        const opts = Array.isArray(r.options) ? r.options : [];
        const answerIndex = r.answer_index == null ? -1 : Number(r.answer_index);
        const examCode = String(r.olympiad || "IOQM").toUpperCase();
        return { id: "sb-" + r.id, olympiad: ["IOQM", "NSEP", "NSEC", "NSEB"].includes(examCode) ? examCode : "IOQM", section: r.topic === "NT" ? "Number Theory (NT)" : (r.topic || "General"), topic: r.topic || "General", difficulty: r.difficulty || "Not set", question: r.question || "", question_type: type, image_url: r.image_url || null, options: opts, answer: Number.isInteger(answerIndex) ? answerIndex : -1, correct_indices: Array.isArray(r.correct_indices) ? r.correct_indices : [], integer_answer: r.integer_answer, hint: r.hint || "", solution: r.solution || "" };
      }).filter(q => q.question && ((q.question_type === "INTEGER" && q.integer_answer != null && Number.isSafeInteger(Number(q.integer_answer))) || (q.question_type === "MULTIPLE_CORRECT" && q.options.length >= 2 && q.correct_indices.length > 0) || (q.question_type === "MCQ" && q.options.length === 4 && q.answer >= 0 && q.answer < 4)));
      const ids = new Set(questions.map(q => q.id));
      questions.push(...mapped.filter(q => !ids.has(q.id)));
      console.info(`Olympiad Problem Lab: loaded ${mapped.length} compatible published questions from Supabase.`);
      if (view === "questions")
        questionList();
      else if (view === "dashboard")
        dashboard();
      else if (view === "exam")
        examPage();
    }
  catch (e) {
    console.error("Published questions could not be loaded:", e);
    toast("Published questions could not load. Check the browser console for the Supabase error.");
  }
}
async function loadLearningContent() {
  if (!db)
    return; try {
      const { data: rows, error } = await db.from("learning_content").select("*").eq("published", true).order("display_order").order("created_at");
      if (error)
        throw error;
      learningContent = (rows || []);
      if (view === "theory")
        learningContentPage("THEORY");
      else if (view === "problem-solving")
        learningContentPage("PROBLEM_SOLVING");
    }
  catch (e) {
    console.warn("Learning content could not be loaded:", e.message);
  }
}
render();
loadPublished();
loadLearningContent();
  </script>
