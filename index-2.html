<script>
"use strict";
const SUPABASE_URL="https://zuuhhsdnpuncazwtlyqt.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_0l4RpY5d3k5J0TjUOonutA_OH9RjODq";
const db=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const KEY="opl_student_progress_v2";
const EXAMS={
 IOQM:{subject:"Mathematics",description:"Build mathematical reasoning and olympiad problem-solving skills.",sections:["Number Theory (NT)","Combinatorics","Algebra","Geometry"]},
 NSEP:{subject:"Physics",description:"Develop conceptual understanding and quantitative problem-solving.",sections:["Mechanics","Electricity","Optics","Thermodynamics","Waves"]},
 NSEC:{subject:"Chemistry",description:"Practise chemical concepts, calculations, and scientific reasoning.",sections:["Physical Chemistry","Organic Chemistry","Inorganic Chemistry"]},
 NSEB:{subject:"Biology",description:"Strengthen biological concepts and scientific reasoning.",sections:["Cell Biology","Genetics","Ecology","Physiology","Evolution"]}
};
function load(){
  const empty={attempts:{},history:[],feedback:[],bookmarks:[]};
  try{
    const raw=localStorage.getItem("opl_student_progress_v2");
    if(!raw)return empty;
    const parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=="object"||Array.isArray(parsed))return empty;
    return {
      attempts:parsed.attempts&&typeof parsed.attempts==="object"&&!Array.isArray(parsed.attempts)?parsed.attempts:{},
      history:Array.isArray(parsed.history)?parsed.history:[],
      feedback:Array.isArray(parsed.feedback)?parsed.feedback:[],
      bookmarks:Array.isArray(parsed.bookmarks)?parsed.bookmarks:[]
    };
  }catch(error){
    console.warn("Saved progress could not be read; starting with empty local progress.",error);
    return empty;
  }
}
let data=load(),questions=[],exam="IOQM",view="dashboard",expanded=true,drawerOpen=false,mode="simple",section="ALL",idx=0,selected={},revealed={},test=null,timer=null;
const $=id=>document.getElementById(id),root=$("content");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));header()}catch(e){toast("Browser storage unavailable. Progress may not save.")}}
function header(){$("headerSolved").textContent=Object.values(data.attempts).filter(a=>a.checked).length}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").style.display="none",2400)}
function qs(e=exam){return questions.filter(q=>q.olympiad===e)}
function secList(e=exam){return [...new Set([...(EXAMS[e].sections),...qs(e).map(q=>q.section)])]}
function done(e=exam){return qs(e).filter(q=>data.attempts[q.id]?.checked)}
function history(e=exam){return data.history.filter(h=>h.exam===e)}
function accuracy(e=exam){let a=done(e);return a.length?Math.round(a.filter(q=>data.attempts[q.id].correct).length/a.length*100):0}
function page(title,sub){$("pageTitle").textContent=title;$("subtitle").textContent=sub}
function nav(){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));document.querySelectorAll("[data-exam]").forEach(b=>b.classList.toggle("active",b.dataset.exam===exam&&view==="exam"));$("examList").classList.toggle("open",expanded);$("olympiadsToggle").setAttribute("aria-expanded",String(expanded));$("olympiadsArrow").textContent=expanded?"⌄":"›";document.body.classList.toggle("drawer-open",drawerOpen);$("topMenuBtn").setAttribute("aria-expanded",String(drawerOpen));header()}

function stat(label,num,sub){return `<div class="card stat"><div class="muted">${esc(label)}</div><div class="number">${esc(num)}</div><div class="muted small">${esc(sub||"")}</div></div>`}
function btn(label,action,primary=false){return `<button class="btn ${primary?"primary":""}" data-action="${esc(action)}">${esc(label)}</button>`}
function dashboard(){page("Student Dashboard","Your preparation, in one place.");let total=Object.values(data.attempts).filter(a=>a.checked).length,correct=Object.values(data.attempts).filter(a=>a.checked&&a.correct).length;let hs=history(exam).slice(-6);let bars=hs.length?hs.map(h=>`<div class="bar-row"><div class="bar-head"><span>${esc(h.mode)} · ${esc(h.date)}</span><strong>${h.score}/${h.total}</strong></div><div class="bar-bg"><div class="bar-fill" style="width:${h.total?Math.max(0,Math.min(100,h.score/h.total*100)):0}%"></div></div></div>`).join(""):`<div class="empty muted">Complete a practice set or mock test to start your score history.</div>`;root.innerHTML=`<div class="card hero"><span class="eyebrow">Your practice workspace</span><h2>${exam} · ${esc(EXAMS[exam].subject)}</h2><p>${esc(EXAMS[exam].description)}</p><div class="btn-row">${btn("Start practice","start",true)} ${btn("Start a mock","setup")} ${btn("Review mistakes","review")} ${btn("Saved questions","bookmarks")}</div></div><div class="grid">${stat("Questions solved",total,"Across all olympiads")}${stat("Correct answers",correct,"From checked questions")}${stat("Overall accuracy",total?Math.round(correct/total*100)+"%":"—","Based on attempted questions")}${stat(exam+" accuracy",done().length?accuracy()+"%":"—",done().length+" questions checked")}</div><div class="card"><h2>${exam} performance history</h2>${bars}</div><div class="card"><h2>Choose an olympiad</h2><div class="section-grid">${Object.keys(EXAMS).map(e=>`<button class="section-card" data-exam="${e}"><strong>${e} · ${esc(EXAMS[e].subject)}</strong><span class="muted">${qs(e).length} published questions available</span></button>`).join("")}</div><p class="footer-note">Questions are loaded from the published question bank. Your scores are stored locally in this browser.</p></div>`}
function about(){page("About Us","A small practice lab built for students.");root.innerHTML=`<div class="card hero"><span class="eyebrow">Think · Solve · Grow</span><h2>Olympiad Problem Lab</h2><p>A student-focused practice space for building concepts, problem-solving habits, and exam confidence.</p></div><div class="card"><h2>What you can do here</h2><ul><li>Practise simple multiple-choice questions.</li><li>Choose sections for focused practice.</li><li>Try short full or section-wise mock tests.</li><li>Review hints, solutions, and your local score history.</li></ul><p class="muted">This is an independent student project, not an official IOQM, NSEP, NSEC, NSEB, or exam-organiser website. Starter questions are illustrative examples.</p></div>`}
function questionList(){page("Problem Library","Browse problems and continue your practice.");root.innerHTML=`<div class="card"><h2>Problem library</h2><div class="field"><label>Olympiad</label><select id="filterExam">${Object.keys(EXAMS).map(e=>`<option ${e===exam?"selected":""}>${e}</option>`).join("")}</select></div><div class="field"><label>Section</label><select id="filterSection"><option value="ALL">All sections</option>${secList(exam).map(s=>`<option>${esc(s)}</option>`).join("")}</select></div><div class="field"><label>Search questions</label><input id="questionSearch" type="search" placeholder="Search a problem or topic..."></div><div class="field"><label>Progress</label><select id="filterStatus"><option value="ALL">All questions</option><option value="INCORRECT">Incorrect only</option><option value="UNATTEMPTED">Not attempted</option><option value="CORRECT">Correct only</option><option value="SAVED">Saved questions</option></select></div><div id="questionRows"></div></div>`;renderQuestionRows()}
function renderQuestionRows(){let e=$("filterExam")?.value||exam,sec=$("filterSection")?.value||"ALL",status=$("filterStatus")?.value||"ALL",term=($("questionSearch")?.value||"").trim().toLowerCase();let list=qs(e).filter(q=>{let a=data.attempts[q.id];return(sec==="ALL"||q.section===sec)&&(!term||(q.question+" "+q.section+" "+q.topic).toLowerCase().includes(term))&&(status==="ALL"||(status==="INCORRECT"&&a?.checked&&!a.correct)||(status==="UNATTEMPTED"&&!a?.checked)||(status==="CORRECT"&&a?.checked&&a.correct)||(status==="SAVED"&&data.bookmarks.includes(q.id))) });$("questionRows").innerHTML=list.length?list.map((q,i)=>{let a=data.attempts[q.id];return `<div class="list-row"><span class="tag">${esc(q.section)}</span><p><strong>${i+1}. ${esc(q.question)}</strong></p><div class="muted">Status: ${a?.checked?(a.correct?"Correct":"Incorrect"): "Not attempted"} · ${data.bookmarks.includes(q.id)?"★ Saved":"Not saved"}</div><div class="btn-row"><button class="btn primary" data-openq="${esc(q.id)}" data-qexam="${e}">Open question</button><button class="btn" data-action="bookmark" data-qid="${esc(q.id)}">${data.bookmarks.includes(q.id)?"Remove saved":"☆ Save question"}</button></div></div>`}).join(""):`<div class="empty">No questions match these filters yet.</div>`} 
function reviewPage(){page("Review mistakes","Retry incorrect questions, then check the solution.");let list=questions.filter(q=>data.attempts[q.id]?.checked&&!data.attempts[q.id].correct);root.innerHTML=`<div class="card"><div class="row between wrap"><div><h2>Incorrect answers</h2><p class="muted">Questions you have checked and answered incorrectly on this device.</p></div><span class="tag">${list.length} to review</span></div>${list.length?list.map(q=>`<div class="list-row"><span class="tag">${esc(q.olympiad)} · ${esc(q.section)}</span><p><strong>${esc(q.question)}</strong></p><div class="muted">Last attempted: ${esc((data.attempts[q.id].date||"").slice(0,10)||"Unknown")}</div><div class="btn-row"><button class="btn primary" data-openq="${esc(q.id)}" data-qexam="${q.olympiad}">Retry question</button><button class="btn" data-action="bookmark" data-qid="${esc(q.id)}">${data.bookmarks.includes(q.id)?"★ Saved":"☆ Save for later"}</button></div></div>`).join(""):`<div class="empty">No mistakes recorded yet. After checking a wrong answer, it will appear here.</div>`}</div>`}
function bookmarksPage(){page("Saved questions","A personal revision list stored in this browser.");let list=questions.filter(q=>data.bookmarks.includes(q.id));root.innerHTML=`<div class="card"><h2>Saved for later · ${list.length}</h2>${list.length?list.map(q=>`<div class="list-row"><span class="tag">${esc(q.olympiad)} · ${esc(q.section)}</span><p><strong>${esc(q.question)}</strong></p><div class="btn-row"><button class="btn primary" data-openq="${esc(q.id)}" data-qexam="${q.olympiad}">Practise</button><button class="btn" data-action="bookmark" data-qid="${esc(q.id)}">Remove saved</button></div></div>`).join(""):`<div class="empty">Save questions from the Problem Library or Practice Arena to build a revision list.</div>`}</div>`}
function examPage(){page(exam+" Practice Centre",EXAMS[exam].subject+" · "+EXAMS[exam].description);root.innerHTML=`<div class="card"><div class="row between wrap"><div><span class="tag">${exam}</span><h2 style="margin-top:10px">Practice centre</h2><p class="muted">${esc(EXAMS[exam].description)}</p></div></div><div class="tabs"><button class="tab ${mode==="simple"?"active":""}" data-mode="simple">Practice Arena</button><button class="tab ${mode==="section"?"active":""}" data-mode="section">Section Practice</button><button class="tab ${mode==="setup"?"active":""}" data-mode="setup">Mock Tests</button></div><div id="examPanel"></div></div>`;panel()}
function panel(){let p=$("examPanel");if(mode==="setup"){p.innerHTML=`<h3>Build your practice test</h3><p class="muted">Create a focused timed set using questions currently available in this workspace.</p>
<select id="testKind" hidden><option value="full">Full mock</option><option value="section">Section mock</option></select>
<select id="testSection" hidden>${secList().map(s=>`<option>${esc(s)}</option>`).join("")}</select>
<select id="testDuration" hidden><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option></select>
<div class="setup-label">TEST FORMAT</div><div class="test-choice-group"><button class="choice-chip choice-card selected" data-settest="kind:full"><strong>Full practice set</strong><span>Mix questions across all available sections</span></button><button class="choice-chip choice-card" data-settest="kind:section"><strong>Section focus</strong><span>Concentrate on one topic area</span></button></div>
<div class="setup-label">SECTION</div><div class="test-choice-group" id="sectionChoices">${secList().map((s,i)=>`<button class="choice-chip ${i===0?"selected":""}" data-settest="section:${esc(s)}">${esc(s)}</button>`).join("")}</div>
<div class="setup-label">TIME LIMIT</div><div class="test-choice-group">${[[5,"5 min"],[10,"10 min"],[20,"20 min"]].map(([v,l])=>`<button class="choice-chip ${v===10?"selected":""}" data-settest="duration:${v}">${l}</button>`).join("")}</div>
<div class="btn-row"><button class="btn primary" data-action="beginTest">Start timed practice <span aria-hidden="true">→</span></button></div>`;return}
if(mode==="section"){p.innerHTML=`<h3>Choose a section</h3><div class="section-grid">${secList().map(s=>`<button class="section-card" data-section="${esc(s)}"><strong>${esc(s)}</strong><span class="muted">${qs().filter(q=>q.section===s).length} available questions</span></button>`).join("")}</div>`;return}
let list=qs();if(!list.length){p.innerHTML=`<div class="empty">No questions are available for this olympiad yet.</div>`;return}idx=Math.max(0,Math.min(idx,list.length-1));p.innerHTML=questionHTML(list[idx],idx,list.length)}
function questionHTML(q,n,total){let a=data.attempts[q.id],sel=selected[q.id]??(a?.checked?a.choice:null),show=!!revealed[q.id],isInteger=q.questionType==="INTEGER",isMulti=q.questionType==="MULTIPLE_CORRECT";let chosen=Array.isArray(sel)?sel:(sel===null||sel===undefined?[]:[sel]);let image=q.imageUrl?`<img class="question-image" src="${esc(q.imageUrl)}" alt="Question illustration" loading="lazy" onerror="this.hidden=true">`:"";let answerUI=isInteger?`<label class="field"><span>Answer (integer)</span><input id="integerAnswer" type="number" step="1" inputmode="numeric" value="${sel===null||sel===undefined?"":esc(sel)}" placeholder="Enter an integer"></label>`:q.options.map((o,i)=>`<label class="option ${a?.checked&&((isMulti&&Array.isArray(q.answer)&&q.answer.includes(i))||(!isMulti&&i===q.answer))?"good":""}"><input type="${isMulti?"checkbox":"radio"}" name="${isMulti?"answerMulti":"answer"}" value="${i}" ${chosen.includes(i)?"checked":""}><span>${esc(o)}</span></label>`).join("");return `<div class="row between wrap"><span class="tag">${esc(q.section)} · ${isInteger?"Integer answer":isMulti?"Multiple-correct MCQ":"Single-correct MCQ"}</span><span class="muted">Question ${n+1} of ${total}</span></div>${image}<div class="problem">${esc(q.question)}</div>${answerUI}<div class="btn-row"><button class="btn" data-action="bookmark" data-qid="${esc(q.id)}">${data.bookmarks.includes(q.id)?"★ Saved":"☆ Save question"}</button><button class="btn" data-action="hint" data-qid="${esc(q.id)}">Show hint</button><button class="btn" data-action="solution" data-qid="${esc(q.id)}">Show solution</button><button class="btn primary" data-action="check" data-qid="${esc(q.id)}">Check answer</button></div>${show?`<div class="feedback">${esc(show==="hint"?q.hint:q.solution)}</div>`:""}${a?.checked?`<div class="feedback ${a.correct?"good":"bad"}">${a.correct?"Correct!":"Not quite."} ${esc(q.solution)}</div>`:""}<div class="btn-row">${btn("Previous","prev")} ${btn("Next question","next",true)} ${btn("Back to dashboard","dashboard")}</div>`}
function feedbackPage(){page("Feedback & Queries","Share a suggestion or report an issue.");root.innerHTML=`<div class="card"><h2>Share feedback</h2><p class="muted">This demo stores feedback in this browser only. It does not send anything to the site owner.</p><div class="field"><label>Type</label><select id="fbType"><option>Suggestion</option><option>Report a question error</option><option>Bug report</option><option>Other</option></select></div><div class="field"><label>Your message</label><textarea id="fbMessage" placeholder="Describe your suggestion or issue..."></textarea></div><button class="btn primary" data-action="saveFeedback">Save feedback locally</button></div><div class="card"><h2>Saved feedback</h2>${data.feedback.length?data.feedback.slice().reverse().map(f=>`<div class="history-item"><strong>${esc(f.type)}</strong><div class="muted">${esc(f.date)}</div><p>${esc(f.message)}</p></div>`).join(""):`<div class="empty muted">No saved feedback yet.</div>`}</div>`}
function render(){nav();if(view==="dashboard")dashboard();else if(view==="about")about();else if(view==="questions")questionList();else if(view==="review")reviewPage();else if(view==="bookmarks")bookmarksPage();else if(view==="feedback")feedbackPage();else examPage()}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function beginTest(){let kind=$("testKind").value,sec=$("testSection").value;let list=qs().filter(q=>kind==="full"||q.section===sec);if(!list.length){toast("No questions available for that selection.");return}stopTimer();test={exam,kind,section:kind==="section"?sec:"All sections",ids:list.map(q=>q.id),answers:{},end:Date.now()+Number($("testDuration").value)*60000};view="test";renderTest();timer=setInterval(()=>{if(!test)return;let left=Math.max(0,test.end-Date.now());let el=$("countdown");if(el)el.textContent=formatTime(left);if(left<=0)submitTest(true)},500)}
function formatTime(ms){let n=Math.ceil(ms/1000);return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function renderTest(){page(exam+" Mock Test",test?test.section+" · timed practice":"Mock test");let list=test.ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean);root.innerHTML=`<div class="card"><div class="row between wrap"><div><span class="tag">${esc(test.exam)} · ${esc(test.kind==="full"?"Full mock":"Section mock")}</span><p class="muted">${list.length} questions · answers are saved when you submit</p></div><div class="timer" id="countdown">${formatTime(test.end-Date.now())}</div></div>${list.map((q,i)=>`<div class="list-row"><strong>${i+1}. ${esc(q.question)}</strong>${q.imageUrl?`<img class="question-image" src="${esc(q.imageUrl)}" alt="Question illustration" loading="lazy">`:""}${q.questionType==="INTEGER"?`<input class="test-integer" type="number" step="1" inputmode="numeric" aria-label="Integer answer for question ${i+1}" name="t_${esc(q.id)}" value="${test.answers[q.id]??""}" placeholder="Enter an integer">`:q.options.map((o,j)=>`<label class="option"><input type="${q.questionType==="MULTIPLE_CORRECT"?"checkbox":"radio"}" name="t_${esc(q.id)}" value="${j}" ${(Array.isArray(test.answers[q.id])?test.answers[q.id].includes(j):test.answers[q.id]===j)?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div>`).join("")}<div class="btn-row"><button class="btn primary" data-action="submitTest">Submit practice</button><button class="btn" data-action="cancelTest">Cancel test</button></div></div>`}
function submitTest(auto=false){if(!test)return;stopTimer();let list=test.ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean),score=0;list.forEach(q=>{let choice=test.answers[q.id],correct=false;if(q.questionType==="INTEGER")correct=String(choice??"").trim()!==""&&String(Number(choice))===String(q.answer);else if(q.questionType==="MULTIPLE_CORRECT"){let got=Array.isArray(choice)?[...choice].map(Number).sort((a,b)=>a-b):[],want=[...q.answer].map(Number).sort((a,b)=>a-b);correct=got.length===want.length&&got.length>0&&got.every((v,i)=>v===want[i]);}else correct=choice===q.answer;if(correct)score++;data.attempts[q.id]={checked:true,choice:choice??null,correct,date:new Date().toISOString()}});data.history.push({exam:test.exam,mode:test.kind==="full"?"Full mock":"Section mock",section:test.section,score,total:list.length,date:new Date().toLocaleDateString()});let summary={exam:test.exam,score,total:list.length,mode:test.kind==="full"?"Full mock":"Section mock"};test=null;save();view="result";result(summary,auto)}
function result(r,auto){page("Test Results",r.exam+" · "+r.mode);root.innerHTML=`<div class="card hero"><span class="eyebrow">${auto?"Time is up":"Test submitted"}</span><h2>${r.score} / ${r.total}</h2><p>${r.total?Math.round(r.score/r.total*100):0}% correct. Review the questions and learn from any mistakes.</p><div class="btn-row">${btn("Dashboard","dashboard")} ${btn("Try another test","setup")}</div></div><div class="card"><h2>Recent test history</h2>${history(r.exam).slice(-8).reverse().map(h=>`<div class="history-item"><strong>${esc(h.mode)} · ${h.score}/${h.total}</strong><div class="muted">${esc(h.date)} · ${esc(h.section||"All sections")}</div></div>`).join("")}</div>`}
function openQuestion(id,e){exam=e;view="exam";mode="simple";idx=Math.max(0,qs(e).findIndex(q=>q.id===id));render()}
function onClick(ev){let b=ev.target.closest("button");if(!b)return;if(b.dataset.view){go(b.dataset.view);return}if(b.dataset.exam){pickExam(b.dataset.exam);return}if(b.id==="olympiadsToggle"){expanded=!expanded;nav();return}if(b.id==="drawerBackdrop"){drawerOpen=false;nav();return}
if(b.dataset.settest){let [key,value]=b.dataset.settest.split(":");if(key==="kind"){$("testKind").value=value;document.querySelectorAll('[data-settest^="kind:"]').forEach(x=>x.classList.toggle("selected",x===b));$("sectionChoices").style.opacity=value==="section"?"1":".55";$("sectionChoices").style.pointerEvents=value==="section"?"auto":"none"}else if(key==="section"){$("testSection").value=value;document.querySelectorAll('[data-settest^="section:"]').forEach(x=>x.classList.toggle("selected",x===b))}else if(key==="duration"){$("testDuration").value=value;document.querySelectorAll('[data-settest^="duration:"]').forEach(x=>x.classList.toggle("selected",x===b))}return}if(b.id==="topMenuBtn"){drawerOpen=!drawerOpen;nav();return}if(b.dataset.mode){mode=b.dataset.mode;panel();return}if(b.dataset.section){section=b.dataset.section;mode="simple";idx=0;let list=qs().filter(q=>q.section===section);if(!list.length){toast("No questions in this section yet.");return}root.innerHTML=`<div class="card"><div class="row between"><h2>${esc(section)}</h2>${btn("All sections","sections")}</div>${questionHTML(list[0],0,list.length)}</div>`;return}if(b.dataset.openq){openQuestion(b.dataset.openq,b.dataset.qexam);return}if(b.dataset.action){let a=b.dataset.action;if(a==="dashboard"){go("dashboard");return}if(a==="start"){view="exam";mode="simple";idx=0;render();return}if(a==="setup"){view="exam";mode="setup";render();return}if(a==="sections"){view="exam";mode="section";render();return}if(a==="prev"){idx=Math.max(0,idx-1);panel();return}if(a==="next"){idx=(idx+1)%Math.max(1,qs().length);panel();return}if(a==="hint"||a==="solution"){revealed[b.dataset.qid]=a==="hint"?"hint":"solution";panel();return}if(a==="bookmark"){let id=b.dataset.qid;data.bookmarks=data.bookmarks||[];data.bookmarks=data.bookmarks.includes(id)?data.bookmarks.filter(x=>x!==id):[...data.bookmarks,id];save();render();return}if(a==="check"){let q=questions.find(q=>q.id===b.dataset.qid);if(!q)return;let choice,correct;if(q.questionType==="INTEGER"){let field=$("integerAnswer");if(!field||field.value.trim()===""||!Number.isInteger(Number(field.value))){toast("Enter a valid integer first.");return}choice=String(Number(field.value));correct=choice===String(q.answer);selected[q.id]=choice;}else if(q.questionType==="MULTIPLE_CORRECT"){choice=[...document.querySelectorAll('input[name="answerMulti"]:checked')].map(el=>Number(el.value)).sort((a,b)=>a-b);if(!choice.length){toast("Select at least one option.");return}let expected=[...q.answer].sort((a,b)=>a-b);correct=choice.length===expected.length&&choice.every((v,i)=>v===expected[i]);selected[q.id]=choice;}else{let chosen=document.querySelector('input[name="answer"]:checked');if(!chosen){toast("Choose an answer first.");return}choice=Number(chosen.value);correct=choice===q.answer;selected[q.id]=choice;}data.attempts[q.id]={checked:true,choice,correct,date:new Date().toISOString()};save();panel();return}if(a==="beginTest"){beginTest();return}if(a==="submitTest"){submitTest(false);return}if(a==="cancelTest"){stopTimer();test=null;view="exam";mode="setup";render();return}if(a==="saveFeedback"){let message=$("fbMessage").value.trim();if(!message){toast("Write a message first.");return}data.feedback.push({type:$("fbType").value,message,date:new Date().toLocaleString()});save();feedbackPage();toast("Saved on this device.");return}}}
document.addEventListener("click",onClick);
$("drawerBackdrop").addEventListener("click",()=>{drawerOpen=false;nav()});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&drawerOpen){drawerOpen=false;nav()}});
document.addEventListener("change",ev=>{if(ev.target.name==="answer"){let q=qs()[idx];if(q)selected[q.id]=Number(ev.target.value)}if(ev.target.name==="answerMulti"){let q=qs()[idx];if(q)selected[q.id]=[...document.querySelectorAll('input[name="answerMulti"]:checked')].map(x=>Number(x.value))}if(ev.target.name?.startsWith("t_")&&test){let id=ev.target.name.slice(2),q=questions.find(item=>item.id===id);if(q){if(q.questionType==="INTEGER")test.answers[id]=ev.target.value;else if(q.questionType==="MULTIPLE_CORRECT")test.answers[id]=[...document.querySelectorAll('input[name="'+ev.target.name+'"]:checked')].map(x=>Number(x.value));else test.answers[id]=Number(ev.target.value)}}if(ev.target.id==="filterExam"){let e=ev.target.value;exam=e;$("filterSection").innerHTML='<option value="ALL">All sections</option>'+secList(e).map(s=>`<option>${esc(s)}</option>`).join("");renderQuestionRows()}if(["filterSection","filterStatus"].includes(ev.target.id))renderQuestionRows()});
document.addEventListener("input",ev=>{if(ev.target.id==="questionSearch")renderQuestionRows()});
async function loadPublished(){if(!db)return;try{let {data:rows,error}=await db.from("questions").select("*").eq("published",true).order("created_at",{ascending:false});if(error)throw error;let mapped=(rows||[]).map(r=>({id:"sb-"+r.id,olympiad:["IOQM","NSEP","NSEC","NSEB"].includes(r.olympiad)?r.olympiad:"IOQM",section:r.topic==="NT"?"Number Theory (NT)":r.topic,topic:r.difficulty||r.topic,question:r.question,questionType:String(r.question_type||"MCQ").toUpperCase(),imageUrl:r.image_url||"",options:Array.isArray(r.options)?r.options:[],answer:String(r.question_type||"").toUpperCase()==="INTEGER"?String(r.integer_answer??""):String(r.question_type||"").toUpperCase()==="MULTIPLE_CORRECT"?(Array.isArray(r.correct_indices)?r.correct_indices.map(Number):[]):Number(r.answer_index),hint:r.hint||"",solution:r.solution||""})).filter(q=>q.questionType==="INTEGER"?q.answer!=="":q.questionType==="MULTIPLE_CORRECT"?q.options.length===4&&Array.isArray(q.answer)&&q.answer.length>0&&q.answer.every(i=>Number.isInteger(i)&&i>=0&&i<4):q.options.length===4&&q.answer>=0&&q.answer<4);let ids=new Set(questions.map(q=>q.id));questions.push(...mapped.filter(q=>!ids.has(q.id)));if(view==="questions")questionList();else if(view==="dashboard")dashboard();else if(view==="exam")examPage()}catch(e){console.warn("Published questions could not be loaded:",e.message)}}
render();loadPublished();
</script>
